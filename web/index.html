<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonAPRS — packet decoder and track map</title>
<style>
  :root {
    --bg: #0a0f14;
    --panel: #0f161d;
    --panel-2: #0c1218;
    --line: #1d2a36;
    --text: #dbe7f0;
    --muted: #7d8fa1;
    --accent: #3ddc97;
    --accent-dim: #185c42;
    --warn: #ffb454;
    --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      linear-gradient(180deg, rgba(61,220,151,.04), transparent 240px),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 18px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--text);
  }
  .brand span { color: var(--accent); }
  .sub {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .spacer { flex: 1; }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    background: rgba(61,220,151,.06);
    padding: 4px 8px;
    border-radius: 2px;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.15fr);
    gap: 1px;
    background: var(--line);
    min-height: 0;
  }
  section { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .label em { color: var(--accent); font-style: normal; }
  .editor { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 12px 16px 16px; gap: 10px; }
  textarea {
    flex: 1;
    min-height: 260px;
    resize: none;
    background: var(--panel-2);
    color: #c8ffe8;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    outline: none;
  }
  textarea:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent-dim); }
  .actions { display: flex; align-items: center; gap: 12px; }
  button {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #04120c;
    background: var(--accent);
    border: 0;
    border-radius: 2px;
    padding: 9px 18px;
    cursor: pointer;
    transition: filter .15s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mapwrap { flex: 1; min-height: 0; padding: 12px 16px; display: flex; }
  #map { flex: 1; display: flex; min-height: 320px; }
  #map svg { width: 100%; height: 100%; display: block; border: 1px solid var(--line); border-radius: 3px; }
  footer { border-top: 1px solid var(--line); background: var(--panel-2); }
  #report {
    margin: 0;
    padding: 12px 16px 16px;
    max-height: 180px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    white-space: pre-wrap;
  }
  #report .ok { color: var(--text); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #map { min-height: 300px; }
    .sub { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">MOON<span>APRS</span></div>
    <div class="sub">APRS / AX.25 toolkit · MoonBit</div>
    <div class="spacer"></div>
    <div class="chip">WASM-FREE · JS TARGET</div>
  </header>

  <main>
    <section>
      <div class="label">Packet log <em>TNC2</em></div>
      <div class="editor">
        <textarea id="input" spellcheck="false">N0CALL-9>APRS,WIDE2-1:!4903.50N/07201.75W-Test beacon
N0CALL-9>APRS,WIDE2-1:!4904.10N/07202.30W-Test beacon 2
N0CALL-9>APRS,WIDE2-1:!4905.00N/07203.10W-Test beacon 3
K1ABC-7>APRS,WIDE1-1,WIDE2-1:@092345z4903.50N/07201.75W>Moving east
WX1ABC>APRS:_10090556c220s004g005t077r000p000P000h50b10159
WX2ABC>APRS:!4903.50N/07201.75W_240/006g010t070h45b10120
K1ABC-7>APRS::N0CALL   :Hello from the field{42
N0CALL-9>APRS::K1ABC-7  :ack42
K1ABC-7>APRS:>Monitoring 146.520 MHz
N0CALL-9>APRS:;PARADE   *092345z4903.50N/07201.75W>Parade route
K1ABC-7>APRS:)AID!4902.00N/07200.00W>Aid station
K1ABC-7>APRS:T#MIC,123,100,200,300,400,500,10101010</textarea>
        <div class="actions">
          <button id="parse">Decode</button>
          <span class="hint">Ctrl / Cmd + Enter</span>
        </div>
      </div>
    </section>

    <section>
      <div class="label">Track map <em>Web Mercator</em></div>
      <div class="mapwrap"><div id="map"></div></div>
    </section>
  </main>

  <footer>
    <pre id="report">decoder idle — press Decode</pre>
  </footer>

  <script src="moonaprs.js"></script>
</body>
</html>
